apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerrag-app
  namespace: careerrag
  labels:
    app: careerrag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: careerrag
  template:
    metadata:
      labels:
        app: careerrag
    spec:
      containers:
        - name: careerrag
          image: lakshitgupta07/careerrag:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: careerrag-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 5
